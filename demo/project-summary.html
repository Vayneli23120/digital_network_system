<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NAS v2.0 — Network Automation System</title>
<style>
/* ===== Reset & Tokens ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --gy:#f6b93b;--gb:#003087;--gb-deep:#001F5C;--accent:#00b894;--accent2:#0984e3;
  --warn:#e17055;--danger:#d63031;--purple:#a855f7;
  --bg:#e8ecf1;--bg-slide:#fff;--bg-muted:#f1f5f9;
  --text:#0f172a;--text2:#334155;--text3:#64748b;--text-muted:#94a3b8;
  --border:#e2e8f0;--border-light:#f1f5f9;
  --radius:8px;--radius-lg:14px;--radius-xl:18px;
  --shadow-sm:0 1px 3px rgba(0,0,0,.06);
  --shadow:0 4px 20px rgba(0,0,0,.08);
  --shadow-lg:0 16px 48px rgba(0,0,0,.12);
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono','Fira Code',monospace;
  --slide-w:min(96vw,1280px);--slide-h:min(94vh,800px);
}
body{font-family:var(--font);background:linear-gradient(135deg,#d5dce4 0%,#e8ecf1 30%,#dce3ea 60%,#c8d2dc 100%);color:var(--text);height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased;user-select:none}

/* ===== Top Bar ===== */
#topbar{
  position:fixed;top:0;left:0;right:0;z-index:100;display:flex;
  align-items:center;justify-content:space-between;padding:8px 20px;
  background:rgba(255,255,255,.85);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);height:40px;
}
#topbar .logo{font-size:13px;font-weight:700;color:var(--text);letter-spacing:-.01em}
#topbar .logo span{color:var(--accent2)}
.progress-bar{position:fixed;top:40px;left:0;height:3px;background:var(--accent2);z-index:101;transition:width .4s cubic-bezier(.4,0,.2,1);border-radius:0 2px 2px 0}
#langBtn{
  padding:4px 14px;border-radius:100px;font-size:11px;font-weight:600;
  cursor:pointer;border:1.5px solid var(--border);background:var(--bg-slide);
  color:var(--text2);transition:all .2s;letter-spacing:.02em;
}
#langBtn:hover{background:var(--accent2);color:#fff;border-color:var(--accent2)}

/* ===== Slide Container ===== */
#stage{position:relative;width:var(--slide-w);height:var(--slide-h);margin-top:20px}
.slide{
  position:absolute;inset:0;background:var(--bg-slide);border-radius:var(--radius-xl);
  box-shadow:var(--shadow-lg);padding:36px 40px;display:flex;flex-direction:column;
  opacity:0;transform:translateX(60px);transition:opacity .45s cubic-bezier(.4,0,.2,1),transform .45s cubic-bezier(.4,0,.2,1);
  pointer-events:none;overflow:hidden;
}
.slide.active{opacity:1;transform:translateX(0);pointer-events:auto}
.slide.exit-left{opacity:0;transform:translateX(-60px)}
.slide.exit-right{opacity:0;transform:translateX(60px)}
.slide .slide-badge{
  display:inline-block;padding:3px 12px;border-radius:100px;font-size:10px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px;width:fit-content;
}
.slide .slide-title{font-size:clamp(20px,2.5vw,28px);font-weight:800;letter-spacing:-.02em;line-height:1.2;margin-bottom:4px}
.slide .slide-subtitle{font-size:13px;color:var(--text3);margin-bottom:20px}

/* Slide layouts */
.slide.hero-slide{justify-content:center;align-items:center;text-align:center;background:linear-gradient(135deg,var(--gb-deep) 0%,#002566 35%,var(--gb) 65%,#00419E 100%);color:#fff}
.slide.hero-slide .slide-title{color:#fff;font-size:clamp(28px,3.5vw,48px)}
.slide.hero-slide .slide-subtitle{color:rgba(255,255,255,.6);font-size:15px}
.slide.split-slide{flex-direction:row;gap:24px;padding:28px 32px}
.slide.split-slide .split-left{flex:1;display:flex;flex-direction:column;justify-content:center}
.slide.split-slide .split-right{flex:1;display:flex;flex-direction:column;justify-content:center}

/* Stagger animation for child elements */
.slide .anim{opacity:0;transform:translateY(20px);transition:opacity .5s ease,transform .5s ease}
.slide.active .anim{opacity:1;transform:translateY(0)}
.slide.active .anim-d1{transition-delay:.05s}
.slide.active .anim-d2{transition-delay:.1s}
.slide.active .anim-d3{transition-delay:.15s}
.slide.active .anim-d4{transition-delay:.2s}
.slide.active .anim-d5{transition-delay:.25s}
.slide.active .anim-d6{transition-delay:.3s}
.slide.active .anim-d7{transition-delay:.35s}
.slide.active .anim-d8{transition-delay:.4s}
.slide.active .anim-d9{transition-delay:.45s}
.slide.active .anim-d10{transition-delay:.5s}

/* ===== Nav Controls ===== */
#navPrev,#navNext{
  position:fixed;top:50%;transform:translateY(-50%);z-index:99;
  width:44px;height:44px;border-radius:50%;border:1.5px solid var(--border);
  background:var(--bg-slide);cursor:pointer;display:flex;align-items:center;
  justify-content:center;font-size:18px;color:var(--text2);
  transition:all .2s;box-shadow:var(--shadow-sm);opacity:.7;
}
#navPrev{left:max(8px,calc((100vw - var(--slide-w))/2 - 52px))}
#navNext{right:max(8px,calc((100vw - var(--slide-w))/2 - 52px))}
#navPrev:hover,#navNext:hover{opacity:1;box-shadow:var(--shadow);color:var(--accent2);border-color:var(--accent2)}
#navPrev:active,#navNext:active{transform:translateY(-50%) scale(.95)}

/* ===== Bottom Bar ===== */
#bottombar{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  display:flex;align-items:center;justify-content:center;gap:12px;
  padding:8px 20px;height:36px;
}
#bottombar .dot{
  width:9px;height:9px;border-radius:50%;background:var(--border);
  cursor:pointer;transition:all .3s;
}
#bottombar .dot.active{background:var(--accent2);width:24px;border-radius:10px}
#bottombar .dot:hover{background:var(--text-muted)}
#slideNum{font-size:10px;color:var(--text-muted);font-family:var(--font-mono);letter-spacing:.04em;min-width:48px;text-align:center}

/* ===== Shared Components ===== */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi-card{
  background:var(--bg-muted);border-radius:var(--radius-lg);padding:14px 16px;
  border-left:3px solid transparent;transition:all .2s;
}
.kpi-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.kpi-card.accent{border-left-color:var(--accent)}
.kpi-card.accent2{border-left-color:var(--accent2)}
.kpi-card.warn{border-left-color:var(--warn)}
.kpi-card.danger{border-left-color:var(--danger)}
.kpi-card.purple{border-left-color:var(--purple)}
.kpi-card .kv{font-size:24px;font-weight:800;font-family:var(--font-mono);line-height:1.1}
.kpi-card.accent .kv{color:var(--accent)}
.kpi-card.accent2 .kv{color:var(--accent2)}
.kpi-card.warn .kv{color:var(--warn)}
.kpi-card.danger .kv{color:var(--danger)}
.kpi-card.purple .kv{color:var(--purple)}
.kpi-card .kl{font-size:10px;color:var(--text3);margin-top:2px;text-transform:uppercase;letter-spacing:.03em}
.kpi-card .ks{font-size:9px;color:var(--text-muted);margin-top:2px}

.value-row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.value-card{
  padding:20px 18px;border-radius:var(--radius-lg);background:var(--bg-muted);
  border-top:3px solid transparent;transition:all .25s;
}
.value-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.value-card.mgmt{border-top-color:var(--accent2)}
.value-card.ops{border-top-color:var(--accent)}
.value-card.ai{border-top-color:var(--purple)}
.value-card .vci{font-size:26px;margin-bottom:8px;display:block}
.value-card h4{font-size:13px;font-weight:700;margin-bottom:4px}
.value-card p{font-size:11px;color:var(--text3);line-height:1.5}

.stat-row{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.stat-item{
  background:var(--bg-muted);border-radius:var(--radius-lg);padding:12px 14px;text-align:center;transition:all .2s;
}
.stat-item:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.stat-item .sv{font-size:22px;font-weight:800;font-family:var(--font-mono);line-height:1.1}
.stat-item .sl{font-size:10px;color:var(--text3);margin-top:2px}
.stat-item.accent .sv{color:var(--accent)}
.stat-item.accent2 .sv{color:var(--accent2)}
.stat-item.warn .sv{color:var(--warn)}
.stat-item.danger .sv{color:var(--danger)}
.stat-item.purple .sv{color:var(--purple)}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.three-col{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}

.panel{
  background:var(--bg-muted);border-radius:var(--radius-lg);padding:16px 18px;
  border:1px solid var(--border-light);
}
.panel h5{font-size:12px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.panel h5 .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

.flow-row{display:flex;align-items:center;gap:6px;justify-content:center;flex-wrap:wrap}
.flow-node{
  text-align:center;padding:12px 16px;border-radius:var(--radius-lg);min-width:100px;
  border:2px solid transparent;transition:all .2s;
}
.flow-node:hover{transform:translateY(-2px)}
.flow-node .fi{font-size:22px;margin-bottom:4px}
.flow-node .ft{font-size:11px;font-weight:700}
.flow-node .fd{font-size:9px;color:var(--text3);line-height:1.3}
.flow-node.mon{background:rgba(9,132,227,.05);border-color:rgba(9,132,227,.18)}
.flow-node.flt{background:rgba(214,48,49,.05);border-color:rgba(214,48,49,.18)}
.flow-node.aid{background:rgba(168,85,247,.05);border-color:rgba(168,85,247,.18)}
.flow-node.mnt{background:rgba(225,112,85,.05);border-color:rgba(225,112,85,.18)}
.flow-node.spr{background:rgba(246,185,59,.06);border-color:rgba(246,185,59,.25)}
.flow-node.vfy{background:rgba(0,184,148,.05);border-color:rgba(0,184,148,.18)}
.flow-arr{font-size:16px;color:var(--text-muted);font-weight:700;flex-shrink:0}
.flow-arr.auto{color:var(--purple)}

.state-flow{display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:center}
.state-badge{
  padding:4px 10px;border-radius:100px;font-size:10px;font-weight:600;white-space:nowrap;
}
.state-badge.open{background:rgba(214,48,49,.08);color:var(--danger);border:1px solid rgba(214,48,49,.2)}
.state-badge.prog{background:rgba(225,112,85,.08);color:var(--warn);border:1px solid rgba(225,112,85,.2)}
.state-badge.done{background:rgba(0,184,148,.08);color:var(--accent);border:1px solid rgba(0,184,148,.2)}
.state-badge.end{background:var(--bg-muted);color:var(--text3);border:1px solid var(--border)}
.state-arr{color:var(--text-muted);font-size:12px;font-weight:700}

.feature-list{list-style:none;display:flex;flex-direction:column;gap:5px}
.feature-list li{font-size:11px;color:var(--text2);padding:6px 10px;background:var(--bg-slide);border-radius:var(--radius);line-height:1.4;padding-left:22px;position:relative}
.feature-list li::before{content:'';position:absolute;left:8px;top:11px;width:5px;height:5px;border-radius:50%}
.feature-list li.c-accent2::before{background:var(--accent2)}
.feature-list li.c-accent::before{background:var(--accent)}
.feature-list li.c-danger::before{background:var(--danger)}
.feature-list li.c-warn::before{background:var(--warn)}
.feature-list li.c-purple::before{background:var(--purple)}
.feature-list li.c-gy::before{background:var(--gy)}

.module-row{display:flex;flex-wrap:wrap;gap:5px}
.module-tag{padding:3px 10px;font-size:10px;border-radius:100px;background:var(--bg-muted);color:var(--text2);font-weight:500;white-space:nowrap;border:1px solid var(--border-light)}

.info-table{width:100%;border-collapse:collapse;font-size:10px}
.info-table th{text-align:left;padding:6px 10px;font-size:9px;text-transform:uppercase;letter-spacing:.04em;color:var(--text3);border-bottom:2px solid var(--border);font-weight:700;background:var(--bg-muted)}
.info-table td{padding:6px 10px;border-bottom:1px solid var(--border-light);color:var(--text2)}
.info-table .mono{font-family:var(--font-mono);font-size:10px;font-weight:600;color:var(--text)}

.hero-metrics{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin-top:24px}
.hm{
  background:rgba(255,255,255,.06);backdrop-filter:blur(8px);
  border-radius:var(--radius);padding:14px 20px;text-align:center;min-width:90px;
  border:1px solid rgba(255,255,255,.08);transition:all .25s;
}
.hm:hover{background:rgba(255,255,255,.12);transform:translateY(-3px)}
.hm b{display:block;font-size:24px;font-weight:800;color:var(--gy);font-family:var(--font-mono)}
.hm span{font-size:9px;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.05em}

/* Agent cards */
.agent-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.agent-card{
  padding:14px;border-radius:var(--radius-lg);background:var(--bg-muted);
  border-top:3px solid var(--purple);transition:all .2s;
}
.agent-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.agent-card h5{font-size:12px;font-weight:700;margin-bottom:3px}
.agent-card p{font-size:10px;color:var(--text3);line-height:1.4}

/* Alert stripes */
.alert-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.alert-item{
  padding:10px 12px;border-radius:var(--radius);font-size:10px;
  display:flex;align-items:flex-start;gap:8px;line-height:1.4;
}
.alert-item .as{width:6px;height:6px;border-radius:50%;margin-top:5px;flex-shrink:0}
.alert-item.danger{background:rgba(214,48,49,.05);border:1px solid rgba(214,48,49,.1)}
.alert-item.danger .as{background:var(--danger)}
.alert-item.warn{background:rgba(225,112,85,.05);border:1px solid rgba(225,112,85,.1)}
.alert-item.warn .as{background:var(--warn)}
.alert-item.info{background:rgba(9,132,227,.05);border:1px solid rgba(9,132,227,.1)}
.alert-item.info .as{background:var(--accent2)}

/* Tech word cloud */
.tech-strip{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.tech-pill{padding:4px 12px;border-radius:100px;font-size:10px;font-weight:500;background:var(--bg-muted);color:var(--text2);border:1px solid var(--border-light)}

/* End slide */
.end-slide{justify-content:center;align-items:center;text-align:center;background:linear-gradient(135deg,var(--gb-deep),var(--gb))}
.end-slide h2{color:#fff;font-size:clamp(24px,3vw,40px);margin-bottom:8px}
.end-slide p{color:rgba(255,255,255,.55);font-size:14px}

/* Responsive */
@media(max-width:900px){
  :root{--slide-w:98vw;--slide-h:96vh}
  .slide{padding:20px 16px}
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .stat-row{grid-template-columns:repeat(3,1fr)}
  .value-row{grid-template-columns:1fr}
  .two-col{grid-template-columns:1fr}
  .three-col{grid-template-columns:1fr}
  .agent-grid{grid-template-columns:repeat(2,1fr)}
  .alert-strip{grid-template-columns:1fr}
  .slide.split-slide{flex-direction:column}
  #navPrev,#navNext{display:none}
  .flow-row{gap:3px}
  .flow-node{min-width:70px;padding:8px 10px}
  .flow-node .ft{font-size:10px}
  .flow-node .fd{display:none}
}
@media(max-width:600px){
  .slide{padding:14px 10px;border-radius:0}
  :root{--slide-w:100vw;--slide-h:100vh}
  .kpi-grid{grid-template-columns:1fr 1fr;gap:6px}
  .kpi-card{padding:10px}
  .kpi-card .kv{font-size:18px}
  .stat-row{grid-template-columns:repeat(2,1fr);gap:6px}
  .hero-metrics{gap:8px}
  .hm{padding:10px 14px;min-width:70px}
  .hm b{font-size:18px}
}
</style>
</head>
<body>

<div id="topbar">
  <div class="logo">NAS <span>v2.0</span></div>
  <button id="langBtn" onclick="toggleLang()">EN / 中</button>
</div>
<div class="progress-bar" id="progressBar"></div>

<div id="stage"></div>

<button id="navPrev" onclick="goSlide(current-1)" title="Previous">◀</button>
<button id="navNext" onclick="goSlide(current+1)" title="Next">▶</button>

<div id="bottombar">
  <span id="slideNum">1 / 10</span>
  <div id="dotsContainer"></div>
</div>

// ===================================================================
// Navigation
// ===================================================================
function goSlide(idx,animate=true){
  if(idx<0||idx>=totalSlides)return;
  const prevSlide=document.querySelector('.slide.active');
  const nextSlide=document.querySelector(`.slide[data-index="${idx}"]`);
  if(!nextSlide||prevSlide===nextSlide)return;

  const fwd=idx>current;

  // ── Animate out previous slide ──
  if(prevSlide&&animate&&transitionsEnabled){
    // clear leftover inline styles so CSS exit class wins
    prevSlide.style.transform='';
    prevSlide.style.opacity='';
    prevSlide.classList.remove('active');
    prevSlide.classList.add(fwd?'exit-left':'exit-right');
    setTimeout(()=>{prevSlide.classList.remove('exit-left','exit-right');},450);
  }else if(prevSlide){
    prevSlide.classList.remove('active');
  }

  // ── Animate in next slide ──
  // Always clear any stale inline styles first
  nextSlide.style.transform='';
  nextSlide.style.opacity='';

  if(animate&&transitionsEnabled){
    // Set inline start position, then force reflow
    nextSlide.style.transform=fwd?'translateX(60px)':'translateX(-60px)';
    nextSlide.style.opacity='0';
    nextSlide.offsetHeight; // force reflow ─ commits the start position
    nextSlide.classList.add('active');
    // Remove inline styles → CSS transition from start → .active position
    nextSlide.style.transform='';
    nextSlide.style.opacity='';
  }else{
    nextSlide.classList.add('active');
  }

  current=idx;
  updateUI();
}

function updateUI(){
  document.getElementById('slideNum').textContent=`${current+1} ${t('of')} ${totalSlides}`;
  document.getElementById('progressBar').style.width=`${((current+1)/totalSlides)*100}%`;
  document.querySelectorAll('#bottombar .dot').forEach((d,i)=>{
    d.classList.toggle('active',i===current);
  });
}

function initDots(){
  const container=document.getElementById('dotsContainer');
  for(let i=0;i<totalSlides;i++){
    const dot=document.createElement('span');
    dot.className='dot'+(i===0?' active':'');
    dot.onclick=()=>goSlide(i);
    container.appendChild(dot);
  }
}

// ===================================================================
// Keyboard + Touch
// ===================================================================
let touchStartX=0,touchStartY=0;
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key===' '){e.preventDefault();goSlide(current+1);}
  if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();goSlide(current-1);}
  if(e.key==='Home'){e.preventDefault();goSlide(0);}
  if(e.key==='End'){e.preventDefault();goSlide(totalSlides-1);}
});
document.addEventListener('touchstart',e=>{touchStartX=e.touches[0].clientX;touchStartY=e.touches[0].clientY;});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-touchStartX;
  const dy=e.changedTouches[0].clientY-touchStartY;
  if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>50){
    if(dx<0)goSlide(current+1);else goSlide(current-1);
  }
});
// Mouse wheel
let wheelTimeout;
document.addEventListener('wheel',e=>{
  if(wheelTimeout)return;
  wheelTimeout=setTimeout(()=>{wheelTimeout=null;},800);
  if(Math.abs(e.deltaX)>Math.abs(e.deltaY)){
    if(e.deltaX>30)goSlide(current+1);
    else if(e.deltaX<-30)goSlide(current-1);
  }else{
    if(e.deltaY>30)goSlide(current+1);
    else if(e.deltaY<-30)goSlide(current-1);
  }
},{passive:true});

// ===================================================================
// Init
// ===================================================================
function init(){
  initDots();
  renderAllSlides();
  goSlide(0,false);
  updateUI();
}
init();
</script>
