<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NAS - 网络自动化运维平台 Demo</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
/* ===== Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --gy: #f6b93b; --gy-pale: #FFF9D6;
  --gb: #003087; --gb-deep: #001F5C; --gb-mid: #00419E;
  --accent: #00b894; --accent2: #0984e3; --warn: #e17055; --danger: #d63031;
  --radius-sm: 6px; --radius-md: 8px; --radius-lg: 12px; --radius-xl: 16px;
  --topbar-h: 56px; --sidebar-w: 240px;
  --font-body: 'Geist', 'Satoshi', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'Geist Mono', 'JetBrains Mono', 'Fira Code', monospace;
  --bg: #f0f4fa; --bg-card: #fff; --bg-hover: #f1f5f9;
  --text: #0D1B2A; --text2: #3A4A5C; --text3: #6B7A8D; --text-muted: #9BAABB;
  --border: #E2E8F2; --border-light: #EEF2F6;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.06); --shadow-md: 0 4px 12px rgba(0,0,0,.08);
  --shadow-lg: 0 8px 30px rgba(0,0,0,.10);
  --transition: 0.25s cubic-bezier(.4,0,.2,1);
}
body.dark {
  --bg: #0d1117; --bg-card: #161b22; --bg-hover: #1c2333;
  --text: #e6edf3; --text2: #c9d1d9; --text3: #8b949e; --text-muted: #6e7681;
  --border: #30363d; --border-light: #21262d;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.3); --shadow-md: 0 4px 12px rgba(0,0,0,.4);
  --shadow-lg: 0 8px 30px rgba(0,0,0,.5);
}
body { font-family: var(--font-body); background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh; transition: background var(--transition), color var(--transition); }

/* ===== Login Overlay ===== */
.login-overlay {
  position: fixed; inset: 0; z-index: 9999;
  background: linear-gradient(135deg, var(--gb-deep) 0%, var(--gb) 40%, var(--gb-mid) 100%);
  display: flex; align-items: center; justify-content: center;
  transition: opacity .5s, visibility .5s;
}
.login-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
.login-card {
  background: #fff; border-radius: var(--radius-xl); padding: 48px 40px;
  width: 420px; box-shadow: 0 20px 60px rgba(0,0,0,.3);
}
.login-card .logo-area { text-align: center; margin-bottom: 32px; }
.login-card .logo-icon {
  width: 56px; height: 56px; border-radius: 14px;
  background: linear-gradient(135deg, var(--gb), var(--gb-deep));
  display: inline-flex; align-items: center; justify-content: center;
  color: #fff; font-size: 28px; margin-bottom: 12px;
}
.login-card h1 { font-size: 22px; color: var(--gb); font-weight: 700; }
.login-card .sub { font-size: 13px; color: #6B7A8D; margin-top: 4px; }
.login-card .field { margin-bottom: 20px; }
.login-card label { display: block; font-size: 13px; font-weight: 600; color: #3A4A5C; margin-bottom: 6px; }
.login-card input {
  width: 100%; height: 44px; border: 1.5px solid #E2E8F2; border-radius: var(--radius-md);
  padding: 0 14px; font-size: 14px; outline: none; transition: border var(--transition);
}
.login-card input:focus { border-color: var(--gb-mid); }
.login-card .btn-login {
  width: 100%; height: 46px; border: none; border-radius: var(--radius-md);
  background: linear-gradient(135deg, var(--gb), var(--gb-deep));
  color: #fff; font-size: 15px; font-weight: 700; cursor: pointer;
  transition: opacity var(--transition); margin-top: 8px;
}
.login-card .btn-login:hover { opacity: 0.9; }
.login-card .sso-hint { text-align: center; margin-top: 16px; font-size: 12px; color: #9BAABB; }
.login-card .sso-hint a { color: var(--gb-mid); cursor: pointer; font-weight: 600; }

/* ===== App Shell ===== */
.app-shell { display: none; height: 100vh; flex-direction: column; }
.app-shell.visible { display: flex; }

/* ===== Topbar ===== */
.topbar {
  height: var(--topbar-h); background: linear-gradient(135deg, var(--gb) 0%, var(--gb-deep) 100%);
  color: #fff; display: flex; flex-direction: column; flex-shrink: 0; position: relative; z-index: 100;
}
.topbar.dark { background: linear-gradient(135deg, #0d1117 0%, #161b22 100%); border-bottom: 1px solid var(--border); }
.topbar-inner { display: flex; align-items: center; height: 53px; padding: 0 20px; gap: 24px; }
.topbar-logo { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.logo-oval {
  width: 32px; height: 32px; border-radius: 9px;
  background: rgba(255,255,255,.18); display: flex; align-items: center; justify-content: center;
  font-size: 18px;
}
.logo-text { font-size: 16px; font-weight: 700; letter-spacing: .3px; white-space: nowrap; }
.top-nav { display: flex; gap: 4px; }
.tn {
  background: none; border: none; color: rgba(255,255,255,.75);
  padding: 6px 16px; border-radius: 6px; font-size: 13.5px; font-weight: 600;
  cursor: pointer; transition: all var(--transition); white-space: nowrap;
}
.tn:hover { color: #fff; background: rgba(255,255,255,.1); }
.tn.active { color: #fff; background: rgba(255,255,255,.18); }
.topbar.dark .tn { color: var(--text3); }
.topbar.dark .tn:hover { color: var(--text); background: var(--bg-hover); }
.topbar.dark .tn.active { color: var(--accent); background: rgba(0,184,148,.12); }
.topbar-right { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.icon-btn {
  width: 34px; height: 34px; border-radius: 8px; border: none;
  background: rgba(255,255,255,.1); color: rgba(255,255,255,.8);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 16px; transition: all var(--transition);
}
.icon-btn:hover { background: rgba(255,255,255,.2); color: #fff; }
.topbar.dark .icon-btn { background: var(--bg-hover); color: var(--text3); }
.topbar.dark .icon-btn:hover { color: var(--accent); }
.lang-label { font-size: 12px; font-weight: 700; }
.user-chip {
  display: flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px;
  border-radius: 20px; background: rgba(255,255,255,.1); cursor: pointer;
  font-size: 13px; transition: background var(--transition);
}
.user-chip:hover { background: rgba(255,255,255,.2); }
.user-avatar {
  width: 28px; height: 28px; border-radius: 50%; background: var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; color: #fff;
}
.topbar-underline { height: 3px; background: var(--gy); }
.topbar.dark .topbar-underline { background: var(--accent); }

/* ===== Layout Body ===== */
.layout-body { display: flex; flex: 1; overflow: hidden; }

/* ===== Sidebar ===== */
.sidebar {
  width: var(--sidebar-w); flex-shrink: 0;
  background: rgba(255,255,255,.72); backdrop-filter: blur(12px);
  border-right: 1px solid var(--border); padding: 12px;
  overflow-y: auto; transition: width var(--transition);
}
.sidebar.collapsed { width: 64px; }
.sidebar.collapsed .sg-label, .sidebar.collapsed .mi-label { display: none; }
.sidebar.collapsed .mi { justify-content: center; padding: 10px; }
.sidebar.collapsed .sg-header { padding: 8px 4px; }
body.dark .sidebar { background: rgba(22,27,34,.82); }
.sidebar-group { margin-bottom: 4px; }
.sg-header {
  display: flex; align-items: center; gap: 8px; padding: 8px 10px;
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  color: var(--text-muted); letter-spacing: .5px;
}
.sg-header .sg-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); }
.mi {
  display: flex; align-items: center; gap: 10px; padding: 9px 12px;
  border-radius: var(--radius-md); cursor: pointer; font-size: 13.5px;
  color: var(--text2); transition: all var(--transition); text-decoration: none;
  margin-bottom: 2px;
}
.mi:hover { background: var(--bg-hover); color: var(--text); }
.mi.active { background: rgba(0,184,148,.12); color: var(--accent); font-weight: 700; }
.mi .mi-icon { font-size: 18px; width: 20px; text-align: center; flex-shrink: 0; }
body.dark .mi.active { background: rgba(0,184,148,.15); }
.collapse-btn {
  display: flex; align-items: center; justify-content: center;
  padding: 8px; margin-top: 8px; border-top: 1px solid var(--border-light);
  cursor: pointer; color: var(--text-muted); font-size: 14px;
  transition: color var(--transition);
}
.collapse-btn:hover { color: var(--text2); }

/* ===== Main Content ===== */
.main-content { flex: 1; overflow-y: auto; padding: 24px; }
.page { display: none; }
.page.active { display: block; }

/* ===== Common Components ===== */
.page-header { margin-bottom: 24px; }
.page-header h2 { font-size: 22px; font-weight: 700; color: var(--text); }
.page-header .breadcrumb { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
.page-header .breadcrumb span { color: var(--accent2); }

/* Stats Row */
.stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px; }
.stat-card {
  background: var(--bg-card); border-radius: var(--radius-lg); padding: 20px 24px;
  box-shadow: var(--shadow-sm); border: 1px solid var(--border-light);
  transition: all var(--transition); position: relative; overflow: hidden;
}
.stat-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
.stat-card .stat-label { font-size: 12px; color: var(--text3); font-weight: 600; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; }
.stat-card .stat-value { font-size: 32px; font-weight: 800; color: var(--text); font-family: var(--font-mono); }
.stat-card .stat-sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
.stat-card .stat-icon {
  position: absolute; right: 20px; top: 20px; font-size: 36px; opacity: .12;
}
.stat-card.accent { border-left: 3px solid var(--accent); }
.stat-card.accent2 { border-left: 3px solid var(--accent2); }
.stat-card.warn { border-left: 3px solid var(--warn); }
.stat-card.danger { border-left: 3px solid var(--danger); }
.stat-card .stat-change { font-size: 12px; font-weight: 600; }
.stat-change.up { color: var(--accent); }
.stat-change.down { color: var(--danger); }

/* Card Panel */
.card-panel {
  background: var(--bg-card); border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm); border: 1px solid var(--border-light);
  padding: 20px 24px; margin-bottom: 20px;
}
.card-panel .panel-title {
  font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 16px;
  padding-bottom: 12px; border-bottom: 1px solid var(--border-light);
  display: flex; align-items: center; gap: 8px;
}
.panel-title .dot { width: 8px; height: 8px; border-radius: 50%; }
.panel-title .dot.green { background: var(--accent); }
.panel-title .dot.blue { background: var(--accent2); }
.panel-title .dot.orange { background: var(--warn); }

/* Grid Layout */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
.grid-2-1 { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }

/* Table */
.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.data-table th {
  text-align: left; padding: 10px 14px; font-size: 11px; font-weight: 700;
  color: var(--text3); text-transform: uppercase; letter-spacing: .5px;
  border-bottom: 2px solid var(--border); white-space: nowrap;
}
.data-table td {
  padding: 10px 14px; border-bottom: 1px solid var(--border-light);
  color: var(--text2); white-space: nowrap;
}
.data-table tbody tr { transition: background var(--transition); }
.data-table tbody tr:hover { background: var(--bg-hover); }
.data-table .text-mono { font-family: var(--font-mono); font-size: 12px; }

/* Badges */
.badge {
  display: inline-block; padding: 2px 10px; border-radius: 20px;
  font-size: 11px; font-weight: 700; line-height: 1.8;
}
.badge-green { background: rgba(0,184,148,.12); color: #009973; }
.badge-blue { background: rgba(9,132,227,.12); color: #0870c0; }
.badge-orange { background: rgba(225,112,85,.12); color: #c95130; }
.badge-red { background: rgba(214,48,49,.12); color: #b52020; }
.badge-gray { background: rgba(108,117,125,.12); color: #666; }
body.dark .badge-green { background: rgba(0,184,148,.18); color: #00b894; }
body.dark .badge-blue { background: rgba(9,132,227,.18); color: #4da6ff; }
body.dark .badge-orange { background: rgba(225,112,85,.18); color: #ff8a6f; }
body.dark .badge-red { background: rgba(214,48,49,.18); color: #ff5555; }
body.dark .badge-gray { background: rgba(139,148,158,.18); color: #aaa; }

/* AI Insight Bar */
.ai-insight {
  background: linear-gradient(135deg, rgba(0,184,148,.08), rgba(9,132,227,.08));
  border: 1px solid rgba(0,184,148,.2); border-radius: var(--radius-lg);
  padding: 14px 20px; display: flex; align-items: center; gap: 12px;
  margin-bottom: 24px; font-size: 13.5px;
}
.ai-insight .ai-icon {
  font-size: 20px; flex-shrink: 0;
}
.ai-insight .ai-text { color: var(--text2); flex: 1; }
.ai-insight .ai-text strong { color: var(--accent); }

/* Chart Container */
.chart-box { width: 100%; height: 300px; }

/* Alert Stream */
.alert-list { list-style: none; max-height: 260px; overflow-y: auto; }
.alert-list li {
  display: flex; align-items: flex-start; gap: 10px; padding: 10px 0;
  border-bottom: 1px solid var(--border-light); font-size: 13px;
}
.alert-list li:last-child { border-bottom: none; }
.alert-list .alert-dot {
  width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; flex-shrink: 0;
}
.alert-list .alert-time { font-size: 11px; color: var(--text-muted); white-space: nowrap; }

/* Toolbar */
.toolbar {
  display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap;
}
.toolbar .search-input {
  height: 36px; border: 1.5px solid var(--border); border-radius: var(--radius-md);
  padding: 0 12px; font-size: 13px; width: 260px; outline: none;
  background: var(--bg-card); color: var(--text); transition: border var(--transition);
}
.toolbar .search-input:focus { border-color: var(--accent2); }
.btn {
  height: 36px; padding: 0 18px; border-radius: var(--radius-md); font-size: 13px;
  font-weight: 600; cursor: pointer; border: 1.5px solid transparent;
  transition: all var(--transition); display: inline-flex; align-items: center; gap: 6px;
  white-space: nowrap;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { opacity: .85; }
.btn-outline { border-color: var(--border); background: var(--bg-card); color: var(--text2); }
.btn-outline:hover { border-color: var(--accent2); color: var(--accent2); }

/* ===== Responsive ===== */
@media (max-width: 1024px) { .grid-2, .grid-2-1, .grid-3 { grid-template-columns: 1fr; } }
@media (max-width: 768px) {
  .sidebar { width: 64px; }
  .sidebar .sg-label, .sidebar .mi-label { display: none; }
  .sidebar .mi { justify-content: center; padding: 10px; }
  .top-nav { display: none; }
  .stats-row { grid-template-columns: repeat(2, 1fr); }
}

/* Scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>

<!-- ===== Login Overlay ===== -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-card">
    <div class="logo-area">
      <div class="logo-icon">&#x1F4E1;</div>
      <h1 data-i18n="loginTitle">网络自动化运维平台</h1>
      <p class="sub" data-i18n="loginSub">Network Automation System v2.0</p>
    </div>
    <div class="field">
      <label data-i18n="username">用户名</label>
      <input type="text" id="loginUser" value="admin" placeholder="admin">

    <div class="field">
      <label data-i18n="password">密码</label>
      <input type="password" id="loginPass" value="password" placeholder="········">

    <button class="btn-login" onclick="doLogin()" data-i18n="loginBtn">登 录</button>
    <p class="sso-hint"><span data-i18n="ssoHint">企业账号请使用</span> <a onclick="doLogin()" data-i18n="ssoLink">SSO 单点登录</a></p>
  </div>
</div>

<!-- ===== App Shell ===== -->
<div class="app-shell" id="appShell">

  <!-- Topbar -->
  <header class="topbar" id="topbar">
    <div class="topbar-inner">
      <div class="topbar-logo">
        <div class="logo-oval">&#x1F4E1;</div>
        <span class="logo-text" data-i18n="logoText">网络自动化运维平台</span>
      </div>
      <nav class="top-nav" id="topNav"></nav>

        <button class="icon-btn lang-btn" onclick="toggleLang()" title="切换语言">

        <button class="icon-btn" onclick="toggleTheme()" title="切换主题" id="themeBtn">&#x263D;</button>
        <div class="user-chip">
          <div class="user-avatar">A</div>
          <span>Admin</span>
        </div>
      </div>
    </div>
    <div class="topbar-underline"></div>
  </header>

  <!-- Layout Body -->
  <div class="layout-body">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar"></aside>

    <!-- Main Content -->
    <main class="main-content" id="mainContent">
      <!-- Pages rendered by JS -->
    </main>
  </div>
</div>

// ===== Render Functions =====
function applyI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = t(el.dataset.i18nPlaceholder); });
  document.getElementById('langLabel').textContent = currentLang === 'zh' ? '中' : 'EN';
  renderAll();
}

function toggleLang() {
  currentLang = currentLang === 'zh' ? 'en' : 'zh';
  applyI18n();
}

function toggleTheme() {
  currentTheme = currentTheme === 'light' ? 'dark' : 'light';
  document.body.classList.toggle('dark', currentTheme === 'dark');
  document.getElementById('topbar').classList.toggle('dark', currentTheme === 'dark');
  document.getElementById('themeBtn').innerHTML = currentTheme === 'dark' ? '&#x2600;' : '&#x263D;';
  // Dispose and re-render charts on theme change
  Object.values(charts).forEach(c => { try { c.dispose(); } catch(e){} });
  charts = {};
  if (currentPage === 'dashboard') { setTimeout(initDashboardCharts, 100); }
}

function doLogin() {
  document.getElementById('loginOverlay').classList.add('hidden');
  document.getElementById('appShell').classList.add('visible');
  renderAll();
}

function renderTopNav() {
  const nav = document.getElementById('topNav');
  nav.innerHTML = topTabs.map(t => {
    const label = currentLang === 'zh' ? t.zh : t.en;
    const active = t.key === currentTopTab ? ' active' : '';
    return `<button class="tn${active}" onclick="switchTopTab('${t.key}')">${label}</button>`;
  }).join('');
}

function renderSidebar() {
  const sidebar = document.getElementById('sidebar');
  const groups = sidebarGroups[currentTopTab] || [];
  sidebar.innerHTML = groups.map(g => {
    const gLabel = t(g.label);
    const itemsHtml = g.items.map(mi => {
      const active = mi.key === currentPage ? ' active' : '';
      const label = t(mi.i18n);
      return `<div class="mi${active}" onclick="switchPage('${mi.key}')">
        <span class="mi-icon">${mi.icon}</span>
        <span class="mi-label">${label}</span>
      </div>`;
    }).join('');
    return `<div class="sidebar-group">
      <div class="sg-header"><span class="sg-dot"></span><span class="sg-label">${gLabel}</span></div>
      ${itemsHtml}
    </div>`;
  }).join('') + `<div class="collapse-btn" onclick="toggleSidebar()">◀</div>`;
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('collapsed');
}

function switchTopTab(key) {
  currentTopTab = key;
  const firstPage = (sidebarGroups[key] && sidebarGroups[key][0] && sidebarGroups[key][0].items[0]) ? sidebarGroups[key][0].items[0].key : 'dashboard';
  if (['devices','backups','faults','dashboard'].includes(firstPage) || true) {
    currentPage = firstPage;
  }
  // Dispose charts before re-render
  Object.values(charts).forEach(c => { try { c.dispose(); } catch(e){} });
  charts = {};
  renderAll();
}

function switchPage(key) {
  currentPage = key;
  Object.values(charts).forEach(c => { try { c.dispose(); } catch(e){} });
  charts = {};
  renderAll();
}

    let actions = '';
    if (f.status === 'open') actions += `<button class="btn btn-outline" style="height:26px;font-size:11px;padding:0 8px;margin-right:4px;" onclick="alert('${t('exportReady')}')">${t('btnDiagnose')}</button><button class="btn btn-outline" style="height:26px;font-size:11px;padding:0 8px;" onclick="alert('${t('exportReady')}')">${t('btnAssign')}</button>`;
    else if (f.status === 'diagnosing') actions += `<button class="btn btn-outline" style="height:26px;font-size:11px;padding:0 8px;" onclick="alert('${t('exportReady')}')">${t('btnClose')}</button>`;
    return `<tr>
      <td><strong>${f.title}</strong></td>
      <td>${f.device}</td>
      <td>${sevBadge}</td>
      <td>${stBadge}</td>
      <td class="text-mono">${f.time}</td>
      <td>${f.assignee}</td>
      <td>${actions}</td>
    </tr>`;
  }).join('');
  return `
    <div class="page-header">
      <div class="breadcrumb">${t('tabDevices')} / ${t('pageFaults')}</div>
      <h2>${t('pageFaults')}</h2>
    </div>
    <div class="card-panel">
      <div class="toolbar">
        <input class="search-input" placeholder="${t('searchFault')}" data-i18n-placeholder="searchFault">
        <button class="btn btn-primary">+ ${t('btnAdd')}</button>
      </div>
      <div style="overflow-x:auto;">
        <table class="data-table">
          <thead><tr>
            <th>${t('colFaultTitle')}</th><th>${t('colFaultDevice')}</th><th>${t('colFaultLevel')}</th><th>${t('colFaultStatus')}</th><th>${t('colFaultTime')}</th><th>${t('colAssignee')}</th><th>${t('colAction')}</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>
  `;
}

// ===== Main Render =====
function renderAll() {
  renderTopNav();
  renderSidebar();

  const main = document.getElementById('mainContent');
  let html = '';
  switch (currentPage) {
    case 'dashboard': html = renderDashboard(); break;
    case 'devices': html = renderDevices(); break;
    case 'backups': html = renderBackups(); break;
    case 'faults': html = renderFaults(); break;
    default:
      // For other sidebar items, just show a placeholder page
      const label = t('mi' + currentPage.charAt(0).toUpperCase() + currentPage.slice(1)) || currentPage;
      html = `<div class="page-header"><h2>${label}</h2></div>
        <div class="card-panel" style="text-align:center;padding:60px;color:var(--text-muted);">
          <div style="font-size:48px;margin-bottom:16px;">🚧</div>
          <p>${label} - ${currentLang === 'zh' ? '演示页面（功能完整版请运行系统）' : 'Demo page (run the full system for complete features)'}</p>
        </div>`;
  }
  main.innerHTML = html;
  applyI18n();

  if (currentPage === 'dashboard') {
    renderAlertStream();
    setTimeout(initDashboardCharts, 150);
  }
}

// ===== Alert Stream =====
function renderAlertStream() {
  const alerts = [
    { dot: 'var(--danger)', time: '08:42', text: currentLang === 'zh' ? 'SW-B2-01 设备离线，ping 不可达' : 'SW-B2-01 offline, ping unreachable' },
    { dot: 'var(--warn)', time: '08:15', text: currentLang === 'zh' ? 'SW-A1-02 Gi1/0/15 端口翻动 #5' : 'SW-A1-02 Gi1/0/15 port flap #5' },
    { dot: 'var(--warn)', time: '07:58', text: currentLang === 'zh' ? 'SW-A1-01 CPU 使用率达到 87%' : 'SW-A1-01 CPU usage reached 87%' },
    { dot: 'var(--accent2)', time: '07:30', text: currentLang === 'zh' ? '每日自动备份任务完成: 10/12 成功' : 'Daily backup completed: 10/12 success' },
    { dot: 'var(--warn)', time: '06:45', text: currentLang === 'zh' ? 'SW-Core-02 CRC 错误率上升至 0.05%' : 'SW-Core-02 CRC error rate up to 0.05%' },
    { dot: 'var(--accent)', time: '06:00', text: currentLang === 'zh' ? '合规扫描完成: 87/100 分' : 'Compliance scan done: 87/100' },
  ];
  const list = document.getElementById('alertStream');
  if (!list) return;
  list.innerHTML = alerts.map(a => `
    <li>
      <span class="alert-dot" style="background:${a.dot}"></span>
      <span style="flex:1">${a.text}</span>
      <span class="alert-time">${a.time}</span>
    </li>
  `).join('');
}

// ===== ECharts Initialization =====
function initDashboardCharts() {
  const isDark = currentTheme === 'dark';
  const textColor = isDark ? '#8b949e' : '#6B7A8D';

  // Device Status Pie
  const domStatus = document.getElementById('chartDeviceStatus');
  if (domStatus) {
    const c = echarts.init(domStatus);
    charts.deviceStatus = c;
    c.setOption({
      tooltip: { trigger: 'item' },
      legend: { bottom: 0, textStyle: { color: textColor, fontSize: 12 } },
      series: [{
        type: 'pie', radius: ['55%', '78%'], center: ['50%', '45%'],
        avoidLabelOverlap: false,
        itemStyle: { borderRadius: 6, borderColor: isDark ? '#161b22' : '#fff', borderWidth: 3 },
        label: { show: false },
        emphasis: { label: { show: true, fontSize: 16, fontWeight: 'bold' } },
        data: [
          { value: 8, name: currentLang==='zh'?'在线':'Online', itemStyle: { color: '#00b894' } },
          { value: 1, name: currentLang==='zh'?'离线':'Offline', itemStyle: { color: '#d63031' } },
          { value: 1, name: currentLang==='zh'?'降级':'Degraded', itemStyle: { color: '#e17055' } },
          { value: 1, name: currentLang==='zh'?'维护中':'Maintenance', itemStyle: { color: '#0984e3' } },
          { value: 1, name: currentLang==='zh'?'未纳管':'Unmanaged', itemStyle: { color: '#636e72' } },
        ]
      }]
    });
  }

  // Fault Trend Line
  const domTrend = document.getElementById('chartFaultTrend');
  if (domTrend) {
    const c = echarts.init(domTrend);
    charts.faultTrend = c;
    const days = currentLang === 'zh'
      ? ['7/24','7/25','7/26','7/27','7/28','7/29','7/30']
      : ['Jul 24','Jul 25','Jul 26','Jul 27','Jul 28','Jul 29','Jul 30'];
    c.setOption({
      tooltip: { trigger: 'axis' },
      legend: { data: [currentLang==='zh'?'新增':'New', currentLang==='zh'?'解决':'Resolved'], bottom: 0, textStyle: { color: textColor, fontSize: 12 } },
      grid: { left: 10, right: 20, top: 10, bottom: 30 },
      xAxis: { type: 'category', data: days, axisLabel: { color: textColor, fontSize: 11 }, axisLine: { lineStyle: { color: textColor } } },
      yAxis: { type: 'value', axisLabel: { color: textColor, fontSize: 11 }, splitLine: { lineStyle: { color: isDark ? '#21262d' : '#EEF2F6' } } },
      series: [
        { name: currentLang==='zh'?'新增':'New', type: 'line', data: [3,2,4,1,3,2,3], smooth: true, symbol: 'circle', symbolSize: 6,
          lineStyle: { color: '#e17055', width: 2.5 }, itemStyle: { color: '#e17055' }, areaStyle: { color: 'rgba(225,112,85,.08)' } },
        { name: currentLang==='zh'?'解决':'Resolved', type: 'line', data: [2,3,3,2,4,1,2], smooth: true, symbol: 'circle', symbolSize: 6,
          lineStyle: { color: '#00b894', width: 2.5 }, itemStyle: { color: '#00b894' }, areaStyle: { color: 'rgba(0,184,148,.08)' } },
      ]
    });
  }

  // Top Fault Devices Bar
  const domTop = document.getElementById('chartTopFaults');
  if (domTop) {
    const c = echarts.init(domTop);
    charts.topFaults = c;
    const devs = ['SW-A1-02','SW-A2-03','SW-B2-01','SW-A1-01','SW-Core-02'];
    c.setOption({
      tooltip: { trigger: 'axis' },
      grid: { left: 10, right: 20, top: 10, bottom: 20 },
      xAxis: { type: 'category', data: devs, axisLabel: { color: textColor, fontSize: 11, rotate: 20 }, axisLine: { lineStyle: { color: textColor } } },
      yAxis: { type: 'value', name: currentLang==='zh'?'故障次数':'Fault Count', nameTextStyle: { color: textColor, fontSize: 11 }, axisLabel: { color: textColor, fontSize: 11 }, splitLine: { lineStyle: { color: isDark ? '#21262d' : '#EEF2F6' } } },
      series: [{
        type: 'bar', data: [
          { value: 5, itemStyle: { color: '#e17055' } },
          { value: 3, itemStyle: { color: '#0984e3' } },
          { value: 2, itemStyle: { color: '#d63031' } },
          { value: 2, itemStyle: { color: '#0984e3' } },
          { value: 1, itemStyle: { color: '#e17055' } },
        ],
        barWidth: 28, borderRadius: [6,6,0,0],
      }]
    });
  }
}

// ===== Init on Load =====
document.addEventListener('DOMContentLoaded', () => {
  applyI18n();
});

// ===== Keyboard shortcut: Enter to login =====
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !document.getElementById('loginOverlay').classList.contains('hidden')) {
    doLogin();
  }
});

// ===== Resize handler for charts =====
window.addEventListener('resize', () => {
  Object.values(charts).forEach(c => { try { c.resize(); } catch(e){} });
});
</script>
</body>
</html>
