<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NAS - 网络自动化运维平台 Demo</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
/* ===== Reset & Design Tokens ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --gy:#f6b93b;--gy-pale:#FFF9D6;--gb:#003087;--gb-deep:#001F5C;--gb-mid:#00419E;
  --accent:#00b894;--accent2:#0984e3;--warn:#e17055;--danger:#d63031;
  --radius-sm:6px;--radius-md:8px;--radius-lg:12px;--radius-xl:16px;--radius-2xl:18px;
  --topbar-h:56px;--sidebar-w:240px;
  --font-body:'Geist','Satoshi',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-mono:'Geist Mono','JetBrains Mono','Fira Code',monospace;
  --bg:#f0f4fa;--bg-card:#fff;--bg-hover:#f1f5f9;--bg-tertiary:#f7f9fc;
  --text:#0D1B2A;--text2:#3A4A5C;--text3:#6B7A8D;--text-muted:#9BAABB;
  --border:#E2E8F2;--border-light:#EEF2F6;
  --shadow-sm:0 1px 3px rgba(0,0,0,.06);--shadow-md:0 4px 12px rgba(0,0,0,.08);
  --shadow-lg:0 8px 30px rgba(0,0,0,.10);--shadow-xl:0 12px 40px rgba(15,23,42,.06);
  --glass-bg:rgba(255,255,255,.84);--glass-border:rgba(255,255,255,.72);
  --transition:.25s cubic-bezier(.4,0,.2,1);
}
body.dark{
  --bg:#0d1117;--bg-card:#161b22;--bg-hover:#1c2333;--bg-tertiary:#1a1f2b;
  --text:#e6edf3;--text2:#c9d1d9;--text3:#8b949e;--text-muted:#6e7681;
  --border:#30363d;--border-light:#21262d;
  --shadow-sm:0 1px 3px rgba(0,0,0,.3);--shadow-md:0 4px 12px rgba(0,0,0,.4);
  --shadow-lg:0 8px 30px rgba(0,0,0,.5);--shadow-xl:0 16px 48px rgba(2,6,23,.3);
  --glass-bg:rgba(15,23,42,.72);--glass-border:rgba(71,85,105,.28);
}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;transition:background var(--transition),color var(--transition);overflow:hidden}

/* ===== Scrollbar ===== */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* ===== Login ===== */
.login-overlay{
  position:fixed;inset:0;z-index:9999;
  background:linear-gradient(135deg,var(--gb-deep) 0%,var(--gb) 40%,var(--gb-mid) 100%);
  display:flex;align-items:center;justify-content:center;transition:opacity .5s,visibility .5s;
}
.login-overlay.hidden{opacity:0;visibility:hidden;pointer-events:none}
.login-card{background:#fff;border-radius:var(--radius-xl);padding:48px 40px;width:420px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.login-card .logo-area{text-align:center;margin-bottom:32px}
.login-card .logo-icon{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,var(--gb),var(--gb-deep));display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:28px;margin-bottom:12px}
.login-card h1{font-size:22px;color:var(--gb);font-weight:700}
.login-card .sub{font-size:13px;color:#6B7A8D;margin-top:4px}
.login-card .field{margin-bottom:20px}
.login-card label{display:block;font-size:13px;font-weight:600;color:#3A4A5C;margin-bottom:6px}
.login-card input{width:100%;height:44px;border:1.5px solid #E2E8F2;border-radius:var(--radius-md);padding:0 14px;font-size:14px;outline:none;transition:border var(--transition)}
.login-card input:focus{border-color:var(--gb-mid)}
.login-card .btn-login{width:100%;height:46px;border:none;border-radius:var(--radius-md);background:linear-gradient(135deg,var(--gb),var(--gb-deep));color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:opacity var(--transition);margin-top:8px}
.login-card .btn-login:hover{opacity:.9}
.login-card .sso-hint{text-align:center;margin-top:16px;font-size:12px;color:#9BAABB}
.login-card .sso-hint a{color:var(--gb-mid);cursor:pointer;font-weight:600}

/* ===== App Shell ===== */
.app-shell{display:none;height:100vh;flex-direction:column}
.app-shell.visible{display:flex}

/* ===== Topbar ===== */
.topbar{height:var(--topbar-h);background:linear-gradient(135deg,var(--gb) 0%,var(--gb-deep) 100%);color:#fff;display:flex;flex-direction:column;flex-shrink:0;position:relative;z-index:100}
.topbar.dark{background:linear-gradient(135deg,#0d1117 0%,#161b22 100%);border-bottom:1px solid var(--border)}
.topbar-inner{display:flex;align-items:center;height:53px;padding:0 20px;gap:24px}
.topbar-logo{display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo-oval{width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:18px}
.logo-text{font-size:16px;font-weight:700;letter-spacing:.3px;white-space:nowrap}
.top-nav{display:flex;gap:4px}
.tn{background:none;border:none;color:rgba(255,255,255,.75);padding:6px 16px;border-radius:6px;font-size:13.5px;font-weight:600;cursor:pointer;transition:all var(--transition);white-space:nowrap}
.tn:hover{color:#fff;background:rgba(255,255,255,.1)}
.tn.active{color:#fff;background:rgba(255,255,255,.18)}
.topbar.dark .tn{color:var(--text3)}
.topbar.dark .tn:hover{color:var(--text);background:var(--bg-hover)}
.topbar.dark .tn.active{color:var(--accent);background:rgba(0,184,148,.12)}
.topbar-right{display:flex;align-items:center;gap:8px;margin-left:auto}
.icon-btn{width:34px;height:34px;border-radius:8px;border:none;background:rgba(255,255,255,.1);color:rgba(255,255,255,.8);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;transition:all var(--transition)}
.icon-btn:hover{background:rgba(255,255,255,.2);color:#fff}
.topbar.dark .icon-btn{background:var(--bg-hover);color:var(--text3)}
.topbar.dark .icon-btn:hover{color:var(--accent)}
.lang-label{font-size:12px;font-weight:700}
.user-chip{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:20px;background:rgba(255,255,255,.1);cursor:pointer;font-size:13px;transition:background var(--transition)}
.user-chip:hover{background:rgba(255,255,255,.2)}
.user-avatar{width:28px;height:28px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff}
.topbar-underline{height:3px;background:var(--gy)}
.topbar.dark .topbar-underline{background:var(--accent)}

/* ===== Layout Body ===== */
.layout-body{display:flex;flex:1;overflow:hidden}

/* ===== Sidebar ===== */
.sidebar{width:var(--sidebar-w);flex-shrink:0;background:rgba(255,255,255,.72);backdrop-filter:blur(12px);border-right:1px solid var(--border);padding:12px;overflow-y:auto;transition:width var(--transition)}
.sidebar.collapsed{width:64px}
.sidebar.collapsed .sg-label,.sidebar.collapsed .mi-label{display:none}
.sidebar.collapsed .mi{justify-content:center;padding:10px}
.sidebar.collapsed .sg-header{padding:8px 4px}
body.dark .sidebar{background:rgba(22,27,34,.82)}
.sidebar-group{margin-bottom:4px}
.sg-header{display:flex;align-items:center;gap:8px;padding:8px 10px;font-size:11px;font-weight:700;text-transform:uppercase;color:var(--text-muted);letter-spacing:.5px}
.sg-header .sg-dot{width:6px;height:6px;border-radius:50%;background:var(--text-muted)}
.mi{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius-md);cursor:pointer;font-size:13.5px;color:var(--text2);transition:all var(--transition);text-decoration:none;margin-bottom:2px}
.mi:hover{background:var(--bg-hover);color:var(--text)}
.mi.active{background:rgba(0,184,148,.12);color:var(--accent);font-weight:700}
.mi .mi-icon{font-size:18px;width:20px;text-align:center;flex-shrink:0}
body.dark .mi.active{background:rgba(0,184,148,.15)}
.collapse-btn{display:flex;align-items:center;justify-content:center;padding:8px;margin-top:8px;border-top:1px solid var(--border-light);cursor:pointer;color:var(--text-muted);font-size:14px;transition:color var(--transition)}
.collapse-btn:hover{color:var(--text2)}

/* ===== Main Content ===== */
.main-content{flex:1;overflow-y:auto}
.page{display:none}
.page.active{display:block}

/* ===== Common Components ===== */
.badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:700;line-height:1.8}
.badge-green{background:rgba(0,184,148,.12);color:#009973}
.badge-blue{background:rgba(9,132,227,.12);color:#0870c0}
.badge-orange{background:rgba(225,112,85,.12);color:#c95130}
.badge-red{background:rgba(214,48,49,.12);color:#b52020}
.badge-gray{background:rgba(108,117,125,.12);color:#666}
body.dark .badge-green{background:rgba(0,184,148,.18);color:#00b894}
body.dark .badge-blue{background:rgba(9,132,227,.18);color:#4da6ff}
body.dark .badge-orange{background:rgba(225,112,85,.18);color:#ff8a6f}
body.dark .badge-red{background:rgba(214,48,49,.18);color:#ff5555}
body.dark .badge-gray{background:rgba(139,148,158,.18);color:#aaa}
.dot{width:8px;height:8px;border-radius:50%}
.dot.critical{background:var(--danger)}
.dot.major{background:var(--warn)}
.dot.minor{background:var(--accent2)}

/* ===== Dashboard Page ===== */
.dash-bg{background:radial-gradient(circle at top left,rgba(9,132,227,.08),transparent 28%),radial-gradient(circle at top right,rgba(0,184,148,.08),transparent 24%),linear-gradient(180deg,#f0f4fa 0%,#f7f9fc 48%,#f0f4fa 100%);min-height:100%}
body.dark .dash-bg{background:radial-gradient(circle at top left,rgba(9,132,227,.1),transparent 28%),radial-gradient(circle at top right,rgba(0,184,148,.08),transparent 24%),linear-gradient(180deg,#070b14 0%,#0a0e14 48%,#070b14 100%)}
.dash-shell{padding:24px;display:flex;flex-direction:column;gap:24px;max-width:1600px;margin:0 auto}
.dash-toolbar{display:flex;align-items:center;justify-content:space-between}
.dash-title{font-size:18px;font-weight:700}
.dash-actions{display:flex;gap:8px}
.btn{padding:0 16px;height:34px;border-radius:var(--radius-md);font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid transparent;transition:all var(--transition);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn-sm{height:28px;padding:0 10px;font-size:12px}
.btn-primary{background:var(--accent2);color:#fff;border-color:var(--accent2)}
.btn-primary:hover{opacity:.85}
.btn-outline{border-color:var(--border);background:var(--bg-card);color:var(--text2)}
.btn-outline:hover{border-color:var(--accent2);color:var(--accent2)}

/* Widget Grid */
.widget-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.widget{grid-column:span 4;position:relative;min-height:0}
.widget.span-1{grid-column:span 1}
.widget.span-2{grid-column:span 2}
.widget.span-3{grid-column:span 3}
.widget.span-4{grid-column:span 4}
.widget.h-1 .widget-body{min-height:90px}
.widget.h-2 .widget-body{min-height:220px}
.widget.h-3 .widget-body{min-height:340px}
.widget-body{height:100%}

/* Realtime Status Strip */
.realtime-strip{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:14px 18px;border-radius:var(--radius-lg);background:var(--bg-card);border:1px solid var(--border);border-left:4px solid #22c55e}
.realtime-strip.yellow{border-left-color:#facc15}
.realtime-strip.red{border-left-color:#ef4444}
.rt-headline{display:flex;align-items:center;gap:8px;font-weight:600}
.rt-title{font-size:14px;color:var(--text)}
.rt-dot{width:10px;height:10px;border-radius:50%;background:#22c55e}
.rt-dot.yellow{background:#facc15}
.rt-dot.red{background:#ef4444;animation:rt-pulse 1.4s infinite}
@keyframes rt-pulse{0%,100%{opacity:1}50%{opacity:.4}}
.rt-metrics{display:flex;gap:24px;flex-wrap:wrap;flex:1}
.rt-item{display:flex;flex-direction:column}
.rt-num{font-size:20px;font-weight:700;color:var(--text);line-height:1.1;font-family:var(--font-mono)}
.rt-label{font-size:12px;color:var(--text-muted)}
.rt-item.warning .rt-num{color:#d97706}
.rt-item.danger .rt-num{color:#ef4444}
.rt-link{font-size:13px;font-weight:600;color:var(--accent2);text-decoration:none;white-space:nowrap}
.rt-link:hover{text-decoration:underline}

/* Sites Breakdown */
.site-breakdown{display:flex;flex-direction:column;gap:8px}
.site-title{font-size:13px;font-weight:600;color:var(--text2)}
.site-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.site-card{padding:10px 12px;border-radius:var(--radius-md);background:var(--bg-card);border:1px solid var(--border);border-top:3px solid #22c55e}
.site-card.yellow{border-top-color:#facc15}
.site-card.red{border-top-color:#ef4444}
.site-head{display:flex;align-items:center;gap:6px}
.site-dot{width:8px;height:8px;border-radius:50%;background:#22c55e}
.site-dot.yellow{background:#facc15}
.site-dot.red{background:#ef4444}
.site-name{font-size:13px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.site-avail{font-size:22px;font-weight:700;color:var(--text);margin:2px 0;font-family:var(--font-mono)}
.site-meta{font-size:12px;color:var(--text-muted)}
.site-meta .off{color:#ef4444}
.site-meta .flt{color:#d97706}

/* Summary Bar */
.summary-bar{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:var(--radius-lg);background:var(--bg-card);border:1px solid var(--border)}
.summary-bar.risk{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.3)}
.summary-bar.warning{background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.3)}
.summary-bar.stable{background:rgba(16,185,129,.1);border-color:rgba(16,185,129,.3)}
.summary-icon{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:var(--radius-md);background:var(--bg-tertiary)}
.summary-bar.risk .summary-icon{background:rgba(239,68,68,.2);color:#ef4444}
.summary-bar.warning .summary-icon{background:rgba(245,158,11,.2);color:#f59e0b}
.summary-bar.stable .summary-icon{background:rgba(16,185,129,.2);color:#10b981}
.summary-text{font-size:14px;font-weight:500;color:var(--text);flex:1;min-width:0}
.summary-range{font-size:11px;color:var(--text-muted);padding:2px 8px;background:var(--bg-tertiary);border-radius:var(--radius-sm);white-space:nowrap}
.summary-ai-badge{font-size:10px;color:#fff;padding:1px 7px;border-radius:8px;background:linear-gradient(135deg,#6366f1,#0ea5e9);white-space:nowrap}

/* KPI Stats Grid */
.kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.kpi-stat{padding:14px 16px;border-radius:var(--radius-lg);background:var(--bg-card);border:1px solid var(--border-light);box-shadow:var(--shadow-sm);cursor:pointer;transition:all var(--transition)}
.kpi-stat:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.kpi-stat .ks-label{font-size:11px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.kpi-stat .ks-value{font-size:26px;font-weight:800;font-family:var(--font-mono);line-height:1.1}
.kpi-stat .ks-sub{font-size:11px;color:var(--text-muted);margin-top:4px}
.ks-trend{font-size:11px;font-weight:600}
.ks-trend.up{color:var(--accent)}
.ks-trend.down{color:var(--danger)}

/* MTTR Funnel */
.mttr-funnel{padding:8px 0}
.mttr-funnel .mttr-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:12px}
.mttr-stage{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.mttr-stage .mttr-name{width:80px;font-size:12px;color:var(--text2);text-align:right;flex-shrink:0}
.mttr-stage .mttr-bar-wrap{flex:1;height:24px;background:var(--bg-hover);border-radius:4px;overflow:hidden}
.mttr-stage .mttr-bar{height:100%;border-radius:4px;transition:width .5s ease;display:flex;align-items:center;padding-left:8px}
.mttr-stage .mttr-bar-label{font-size:11px;color:#fff;font-weight:600;font-family:var(--font-mono)}

/* Pareto Chart */
.pareto-wrap{display:flex;flex-direction:column;gap:8px}
.pareto-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:4px}
.pareto-row{display:flex;align-items:center;gap:10px}
.pareto-row .p-name{width:100px;font-size:12px;color:var(--text2);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0}
.pareto-row .p-bar-wrap{flex:1;height:20px;background:var(--bg-hover);border-radius:4px;overflow:hidden}
.pareto-row .p-bar{height:100%;border-radius:4px;transition:width .5s ease}
.pareto-row .p-val{font-size:12px;font-weight:600;color:var(--text);font-family:var(--font-mono);width:36px;text-align:right;flex-shrink:0}

/* SLO Error Budget */
.slo-wrap{display:flex;flex-direction:column;gap:10px}
.slo-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:4px}
.slo-row{display:flex;align-items:center;gap:12px}
.slo-row .slo-name{width:100px;font-size:12px;color:var(--text2);text-align:right;flex-shrink:0}
.slo-row .slo-bar-wrap{flex:1;height:10px;background:var(--bg-hover);border-radius:5px;overflow:hidden}
.slo-row .slo-bar{height:100%;border-radius:5px;transition:width .5s ease}
.slo-row .slo-bar.burnt{background:var(--danger)}
.slo-row .slo-bar.remaining{background:var(--accent)}
.slo-row .slo-pct{font-size:12px;font-weight:600;color:var(--text);font-family:var(--font-mono);width:48px;text-align:right;flex-shrink:0}

/* Change-Fault Correlation */
.change-corr{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.change-corr .cc-item{display:flex;flex-direction:column;align-items:center;padding:8px 16px;border-radius:var(--radius-md);background:var(--bg-tertiary)}
.change-corr .cc-num{font-size:24px;font-weight:700;font-family:var(--font-mono)}
.change-corr .cc-label{font-size:11px;color:var(--text3)}

/* Dashboard Footer */
.dash-footer{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;border-radius:var(--radius-xl);background:rgba(15,23,42,.92);border:1px solid rgba(255,255,255,.06);color:rgba(203,213,225,.35);font-size:12px;font-family:var(--font-mono)}

/* ===== Operations Page ===== */
.ops-shell{padding:24px;display:flex;flex-direction:column;gap:24px;max-width:1600px;margin:0 auto;min-height:100%}

/* AI Recommendations */
.ai-reco-strip{border:1px solid var(--border);border-radius:10px;background:var(--bg-card);padding:14px 16px}
.ai-reco-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ai-reco-title{font-size:14px;font-weight:700}
.ai-reco-count{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:#ef4444;color:#fff;font-size:12px;line-height:20px;text-align:center}
.ai-reco-badge{padding:1px 8px;border-radius:10px;background:linear-gradient(135deg,#6366f1,#0ea5e9);color:#fff;font-size:11px;line-height:18px;white-space:nowrap}
.ai-reco-pending{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--text2);white-space:nowrap}
.ai-reco-dot{width:7px;height:7px;border-radius:50%;background:#6366f1;animation:aiRecoPulse 1s ease-in-out infinite}
@keyframes aiRecoPulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
.ai-briefing{margin-bottom:12px;padding:10px 12px;border-radius:8px;background:rgba(99,102,241,.06);border:1px solid rgba(99,102,241,.18)}
.ai-briefing-text{margin:0;font-size:13px;font-weight:600;color:var(--text)}
.ai-briefing-priorities{margin:6px 0 0;padding-left:18px;font-size:12px;color:var(--text2)}
.ai-briefing-priorities li{margin:2px 0}
.ai-briefing-insight{margin:6px 0 0;font-size:12px;font-style:italic;color:var(--text2)}
.ai-reco-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.ai-reco-card{display:flex;flex-direction:column;gap:4px;text-align:left;padding:10px 12px;border:1px solid var(--border);border-left-width:4px;border-radius:8px;background:var(--bg-card);cursor:pointer;transition:box-shadow .15s}
.ai-reco-card:hover{box-shadow:0 2px 10px rgba(0,0,0,.08)}
.ai-reco-card.critical{border-left-color:var(--danger)}
.ai-reco-card.high{border-left-color:var(--warn)}
.ai-reco-card.medium{border-left-color:#f59e0b}
.ai-reco-card.low{border-left-color:var(--accent2)}
.ai-reco-cat{font-size:11px;color:var(--text2);text-transform:uppercase}
.ai-reco-card-title{font-size:13px;color:var(--text);font-weight:700}
.ai-reco-detail{font-size:12px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Section Heading */
.section-heading{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:16px}
.section-title{font-size:20px;font-weight:700;color:var(--text);letter-spacing:-.03em}
.section-desc{max-width:460px;font-size:13px;line-height:1.6;color:var(--text3);text-align:right}

/* Ops KPI Cards */
.ops-kpi-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.ops-kpi-card{background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:var(--radius-2xl);box-shadow:var(--shadow-xl);backdrop-filter:blur(14px);padding:20px;transition:all .25s ease;cursor:pointer}
.ops-kpi-card:hover{transform:translateY(-3px);box-shadow:0 18px 48px rgba(9,132,227,.1)}
.ops-kpi-card.span-row{grid-row:span 2}

.kpi-header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.kpi-icon{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:10px;flex-shrink:0}
.kpi-icon svg{width:16px;height:16px}
.kpi-icon.devices{background:rgba(9,132,227,.12);color:var(--accent2)}
.kpi-icon.faults{background:rgba(214,48,49,.12);color:var(--danger)}
.kpi-icon.cost{background:rgba(225,112,85,.12);color:var(--warn)}
.kpi-icon.inventory{background:rgba(46,139,87,.12);color:#2e8b57}
.kpi-icon.has-alert{animation:pulse-warning 2s infinite}
@keyframes pulse-warning{0%,100%{opacity:1}50%{opacity:.7}}
.kpi-title{font-size:12px;font-weight:600;color:var(--text2);letter-spacing:.03em}
.trend-badge{margin-left:auto;padding:3px 10px;border-radius:999px;background:rgba(0,184,148,.08);color:#059669;font-size:11px;font-weight:600}
.trend-badge.alert{background:rgba(214,48,49,.12);color:var(--danger);border:1px solid rgba(214,48,49,.3)}
.device-health-score{margin-left:auto;font-family:var(--font-mono);font-size:14px;font-weight:700;padding:4px 10px;border-radius:999px}
.device-health-score.healthy{background:rgba(0,184,148,.12);color:var(--accent)}
.device-health-score.warning{background:rgba(245,158,11,.12);color:#f59e0b}
.device-health-score.critical{background:rgba(239,68,68,.12);color:#ef4444}
body.dark .device-health-score.healthy{background:rgba(0,184,148,.15);color:#55efc4}
body.dark .device-health-score.warning{background:rgba(245,158,11,.15);color:#fbbf24}
body.dark .device-health-score.critical{background:rgba(239,68,68,.15);color:#f87171}

/* NOC Device Panel */
.noc-device-panel{display:flex;flex-direction:column;gap:16px}
.noc-top-section{display:flex;align-items:center;gap:16px;padding-bottom:14px;border-bottom:1px solid rgba(148,163,184,.1)}
.noc-health-gauge{position:relative;width:80px;height:80px;flex-shrink:0}
.noc-ring{width:100%;height:100%;transform:rotate(-90deg)}
.noc-ring-bg{fill:none;stroke:rgba(148,163,184,.12);stroke-width:8}
.noc-ring-progress{fill:none;stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.noc-ring-progress.healthy{stroke:var(--accent)}
.noc-ring-progress.warning{stroke:#f59e0b}
.noc-ring-progress.critical{stroke:#ef4444}
.noc-health-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px}
.noc-health-value{font-family:var(--font-mono);font-size:22px;font-weight:700;color:var(--text);line-height:1}
.noc-health-label{font-size:9px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em}
.noc-quick-stats{flex:1;display:flex;gap:8px}
.noc-stat-box{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 6px;border-radius:10px;background:rgba(248,250,252,.92)}
body.dark .noc-stat-box{background:rgba(30,41,59,.5)}
.noc-stat-value{font-family:var(--font-mono);font-size:18px;font-weight:700;color:var(--text)}
.noc-stat-value.reachability{color:var(--accent)}
.noc-stat-value.warning{color:#f59e0b}
.noc-stat-label{font-size:10px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.04em}
.noc-layers{display:flex;flex-direction:column;gap:12px}
.noc-layer{display:flex;flex-direction:column;gap:6px}
.noc-layer-header{display:flex;justify-content:space-between;align-items:center}
.noc-layer-name{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.06em}
.noc-layer-count{font-family:var(--font-mono);font-size:11px;font-weight:600;color:var(--text-muted)}
.noc-layer-bar{height:6px;border-radius:3px;overflow:hidden;background:rgba(148,163,184,.1);display:flex}
.noc-segment{transition:width .4s ease}
.noc-segment.reachable{background:var(--accent)}
.noc-segment.unreachable{background:#ef4444}
.noc-segment.maintenance{background:#f59e0b}
.noc-layer-types{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.noc-type-pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;background:rgba(248,250,252,.92);font-size:11px;opacity:.4}
body.dark .noc-type-pill{background:rgba(30,41,59,.5)}
.noc-type-pill.active{opacity:1}
.noc-type-pill.alert{background:rgba(239,68,68,.08)}
.noc-type-dot{width:6px;height:6px;border-radius:50%}
.noc-type-dot.ok{background:var(--accent)}
.noc-type-dot.warn{background:#f59e0b}
.noc-type-dot.alert{background:#ef4444}
.noc-type-dot.empty{background:#94a3b8}
.noc-type-name{color:var(--text2)}
.noc-type-num{font-family:var(--font-mono);font-weight:600;color:var(--text)}
.noc-compliance{background:rgba(9,132,227,.04);border:1px solid rgba(9,132,227,.1);border-radius:10px;padding:10px 12px}
.noc-compliance-header{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--accent2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.noc-compliance-grid{display:flex;flex-direction:column;gap:6px}
.noc-compliance-item{display:flex;align-items:center;gap:8px;font-size:11px}
.noc-compliance-bar{width:60px;height:4px;border-radius:2px;background:rgba(148,163,184,.1);overflow:hidden}
.noc-compliance-fill{height:100%;border-radius:2px;background:var(--accent)}
.noc-compliance-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.noc-compliance-dot.changed{background:#f59e0b}
.noc-compliance-dot.issue{background:#ef4444}
.noc-compliance-label{color:var(--text3);flex:1}
.noc-compliance-value{font-family:var(--font-mono);font-weight:600;color:var(--text)}

/* Fault Events Card */
.big-number{font-family:var(--font-mono);font-size:32px;font-weight:700;color:var(--text);letter-spacing:-.03em;margin-bottom:2px}
.big-number.danger{color:var(--danger)}
.big-number.success{color:var(--accent)}
.fault-active-section{text-align:center;margin-bottom:8px}
.fault-active-section.has-active{background:rgba(214,48,49,.04);border-radius:8px;padding:8px}
.active-label{font-size:11px;color:var(--text3);margin-top:2px}
.severity-row{display:flex;gap:10px;justify-content:center}
.severity-tag{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:8px;background:rgba(248,250,252,.92)}
body.dark .severity-tag{background:rgba(30,41,59,.6)}
.severity-label{font-size:12px;font-weight:500;color:var(--text2)}
.severity-num{font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--text)}
.fault-resolved-section{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px;padding:4px 8px;background:rgba(0,184,148,.06);border-radius:6px}
.resolved-label{font-size:11px;color:var(--text3)}
.resolved-num{font-size:12px;font-weight:600;color:var(--accent)}
.resolved-period{font-size:10px;color:var(--text-muted)}
.fault-maintenance-footer{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid rgba(148,163,184,.1)}
.maint-label{font-size:10px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em}
.maint-item{font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;background:rgba(248,250,252,.6)}
.maint-item.warn{color:#d97706}
.maint-item.active{color:var(--accent2)}
.maint-item.success{color:#059669}

/* Cost Card */
.cost-split{display:flex;gap:12px;margin:8px 0}
.cost-item-label{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:8px;background:rgba(248,250,252,.92);font-size:12px;color:var(--text2)}
body.dark .cost-item-label{background:rgba(30,41,59,.6)}
.cost-dot{width:8px;height:8px;border-radius:3px;flex-shrink:0}
.cost-dot.parts{background:rgba(225,112,85,.9)}
.cost-dot.labor{background:rgba(9,132,227,.9)}
.cost-bar-chart{height:70px;margin-top:4px}
.bar-group{display:flex;align-items:flex-end;justify-content:space-around;height:56px;padding:0 2px;gap:4px}
.cost-bar-item{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
.cost-bar-track{width:100%;height:50px;position:relative;background:rgba(148,163,184,.08);border-radius:4px;overflow:hidden}
.cost-bar-fill{position:absolute;bottom:0;left:0;width:100%;border-radius:4px;transition:height .4s ease}
.cost-bar-fill.parts{background:rgba(225,112,85,.7)}
.cost-bar-fill.labor{background:rgba(9,132,227,.7)}
.cost-bar-label{font-size:9px;color:var(--text-muted);font-family:var(--font-mono);white-space:nowrap}

/* Spare Row */
.spare-row{display:flex;gap:8px}
.spare-stat{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px;border-radius:10px;background:rgba(248,250,252,.92);font-size:11px;color:var(--text3);text-align:center}
body.dark .spare-stat{background:rgba(30,41,59,.5)}
.spare-num{font-family:var(--font-mono);font-size:18px;font-weight:700;color:var(--text)}
.spare-num.warning{color:#d97706}

/* Top 5 List */
.top5-list{display:flex;flex-direction:column;gap:6px}
.top5-item{display:grid;grid-template-columns:18px 1fr 28px;align-items:center;gap:6px;padding:4px 8px;border-radius:8px;background:rgba(248,250,252,.92);transition:background .15s}
body.dark .top5-item{background:rgba(30,41,59,.5)}
.top5-item:hover{background:rgba(148,163,184,.12)}
.top5-rank{font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--text-muted);text-align:center}
.top5-name{font-size:12px;font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top5-count{font-family:var(--font-mono);font-size:12px;font-weight:600;color:var(--danger);text-align:right}

/* Charts Section */
.charts-split{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.chart-panel,.risk-panel,.activity-panel{background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:var(--radius-2xl);box-shadow:var(--shadow-xl);backdrop-filter:blur(14px);overflow:hidden}
.chart-panel.emphasis{background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(243,248,252,.92))}
body.dark .chart-panel.emphasis{background:linear-gradient(180deg,rgba(15,23,42,.86),rgba(13,17,23,.82))}
.panel-header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid rgba(148,163,184,.12)}
.panel-title{font-size:14px;font-weight:700;color:var(--text)}
.panel-body{padding:20px}
.link-btn{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--accent2);background:transparent;border:none;cursor:pointer;transition:color .2s}
.link-btn:hover{color:#0b6ec2}
.pill-tabs{display:flex;gap:4px;padding:3px;background:rgba(148,163,184,.1);border-radius:10px}
.pill-tab{padding:5px 12px;font-size:11px;font-weight:600;color:var(--text3);background:transparent;border:none;border-radius:8px;cursor:pointer;transition:all .2s;font-family:var(--font-mono)}
.pill-tab:hover{color:var(--text)}
.pill-tab.active{background:var(--bg-card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.date-input{padding:5px 8px;font-size:11px;background:rgba(255,255,255,.92);border:1px solid rgba(148,163,184,.2);border-radius:8px;color:#334155;font-family:var(--font-mono);width:110px}
body.dark .date-input{background:rgba(30,41,59,.7);border-color:rgba(71,85,105,.3);color:#e2e8f0}
.date-separator{color:var(--text3);font-size:11px}
.line-chart-container{height:300px}
.alert-badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:2px 6px;font-size:11px;font-weight:600;color:#fff;background:var(--danger);border-radius:999px}

/* Backup Panel */
.backup-panel-list{display:flex;flex-direction:column;gap:0}
.backup-panel-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(148,163,184,.1);font-size:12px}
.backup-panel-item:last-child{border-bottom:none}
.backup-panel-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0}
.backup-panel-dot.changed{background:#f59e0b}
.backup-panel-name{flex:1;color:var(--text);font-weight:500}
.backup-panel-time{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}

/* Event Stream */
.event-item{display:flex;gap:12px;padding:14px 20px;transition:background .2s;cursor:pointer}
.event-item:hover{background:rgba(248,250,252,.6)}
body.dark .event-item:hover{background:rgba(30,41,59,.4)}
.event-timeline-marker{display:flex;flex-direction:column;align-items:center;gap:0;padding-top:4px}
.event-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.event-dot.danger{background:var(--danger)}
.event-dot.warn{background:var(--warn)}
.event-dot.info{background:var(--accent2)}
.event-dot.success{background:var(--accent)}
.event-line{width:2px;flex:1;background:rgba(148,163,184,.15);margin-top:4px}
.event-item:last-child .event-line{display:none}
.event-content{display:flex;flex-direction:column;gap:2px;flex:1}
.event-title{font-size:13px;font-weight:600;color:var(--text)}
.event-summary{font-size:12px;color:var(--text3)}
.event-time{font-size:11px;font-family:var(--font-mono);color:var(--text-muted)}
.event-empty{padding:32px 20px;text-align:center;color:var(--text-muted);font-size:13px}

/* Activity Feed */
.activity-item{display:flex;gap:12px;padding:14px 20px;transition:background .2s;cursor:pointer}
.activity-item:hover{background:rgba(248,250,252,.6)}
body.dark .activity-item:hover{background:rgba(30,41,59,.4)}
.activity-icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.activity-icon.backup{background:rgba(0,184,148,.1);color:#059669}
.activity-icon.fault{background:rgba(214,48,49,.1);color:var(--danger)}
.activity-icon.maintenance{background:rgba(245,158,11,.1);color:#d97706}
.activity-icon.health{background:rgba(71,85,105,.08);color:var(--text2)}
.activity-body{display:flex;flex-direction:column;gap:2px;flex:1}
.activity-text{font-size:13px;color:var(--text);line-height:1.4}
.activity-time{font-size:11px;font-family:var(--font-mono);color:var(--text-muted)}

/* Activity Grid */
.activity-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}

/* ===== Simple Pages (Devices, Backups, Faults) ===== */
.simple-shell{padding:24px;max-width:1600px;margin:0 auto}
.page-header{margin-bottom:24px}
.page-header h2{font-size:22px;font-weight:700}
.page-header .breadcrumb{font-size:12px;color:var(--text-muted);margin-bottom:4px}
.page-header .breadcrumb span{color:var(--accent2)}
.card-panel{background:var(--bg-card);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);border:1px solid var(--border-light);padding:20px 24px;margin-bottom:20px}
.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.toolbar .search-input{height:36px;border:1.5px solid var(--border);border-radius:var(--radius-md);padding:0 12px;font-size:13px;width:260px;outline:none;background:var(--bg-card);color:var(--text);transition:border var(--transition)}
.toolbar .search-input:focus{border-color:var(--accent2)}
.data-table{width:100%;border-collapse:collapse;font-size:13px}
.data-table th{text-align:left;padding:10px 14px;font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid var(--border);white-space:nowrap}
.data-table td{padding:10px 14px;border-bottom:1px solid var(--border-light);color:var(--text2);white-space:nowrap}
.data-table tbody tr{transition:background var(--transition)}
.data-table tbody tr:hover{background:var(--bg-hover)}
.text-mono{font-family:var(--font-mono);font-size:12px}

/* ===== Responsive ===== */
@media(max-width:1200px){.kpi-grid{grid-template-columns:repeat(3,1fr)}.ops-kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.ops-kpi-card.span-row{grid-row:span 1}}
@media(max-width:1024px){.charts-split,.activity-grid{grid-template-columns:1fr}.ops-kpi-grid{grid-template-columns:1fr}}
@media(max-width:900px){.widget-grid{grid-template-columns:repeat(2,1fr)}.widget.span-3,.widget.span-4{grid-column:span 2}.kpi-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){.sidebar{width:64px}.sidebar .sg-label,.sidebar .mi-label{display:none}.sidebar .mi{justify-content:center;padding:10px}.top-nav{display:none}}
@media(max-width:640px){.widget-grid{grid-template-columns:1fr}.widget.span-2,.widget.span-3,.widget.span-4{grid-column:span 1}.kpi-grid{grid-template-columns:1fr}.dash-shell,.ops-shell,.simple-shell{padding:12px}}
</style>
</head>
<body>

<!-- Login Overlay -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-card">
    <div class="logo-area">
      <div class="logo-icon">&#x1F4E1;</div>
      <h1 data-i18n="loginTitle">网络自动化运维平台</h1>
      <p class="sub" data-i18n="loginSub">Network Automation System v2.0</p>

      <input type="password" id="loginPass" value="password" placeholder="········">

<!-- App Shell -->
<div class="app-shell" id="appShell">

</div>

<script>
// ==================== i18n ====================
const i18n = {
  zh: {
    loginTitle:'网络自动化运维平台',loginSub:'Network Automation System v2.0',username:'用户名',password:'密码',loginBtn:'登 录',ssoHint:'企业账号请使用',ssoLink:'SSO 单点登录',logoText:'网络自动化运维平台',
    tabMonitor:'运维监控',tabDevices:'设备管理',tabConfig:'配置管理',tabAssets:'资产管理',tabSystem:'系统设置',

function t(k){return i18n[currentLang][k]||k}

function applyI18n(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n)});
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{el.placeholder=t(el.dataset.i18nPlaceholder)});
  var le=document.getElementById('langLabel');if(le)le.textContent=currentLang==='zh'?'中':'EN';
}
function toggleLang(){currentLang=currentLang==='zh'?'en':'zh';destroyCharts();renderAll()}
function toggleTheme(){
  currentTheme=currentTheme==='light'?'dark':'light';
  document.body.classList.toggle('dark',currentTheme==='dark');
  document.getElementById('topbar').classList.toggle('dark',currentTheme==='dark');
  document.getElementById('themeBtn').innerHTML=currentTheme==='dark'?'&#x2600;':'&#x263D;';
  Object.values(charts).forEach(c=>{try{c.dispose()}catch(e){}});charts={};
  if(currentPage==='dashboard')setTimeout(initDashboardCharts,100);
  if(currentPage==='operations')setTimeout(initOperationsCharts,100);
}

    return `<button class="tn${tb.key===currentTopTab?' active':''}" onclick="switchTopTab('${tb.key}')">${label}</button>`;
  }).join('');

function renderSidebar(){
  const groups=sidebarGroups[currentTopTab]||[];
  document.getElementById('sidebar').innerHTML=groups.map(g=>{
    const gLabel=t(g.label);
    const itemsHtml=g.items.map(mi=>{
      const active=mi.key===currentPage?' active':'';
      return `<div class="mi${active}" onclick="switchPage('${mi.key}')"><span class="mi-icon">${mi.icon}</span><span class="mi-label">${t(mi.i18n)}</span></div>`;
    }).join('');
    return `<div class="sidebar-group"><div class="sg-header"><span class="sg-dot"></span><span class="sg-label">${gLabel}</span></div>${itemsHtml}</div>`;
  }).join('')+`<div class="collapse-btn" onclick="document.getElementById('sidebar').classList.toggle('collapsed')">◀</div>`;
}
function switchTopTab(key){
  currentTopTab=key;
  const groups=sidebarGroups[key]||[];
  currentPage=(groups[0]&&groups[0].items[0])?groups[0].items[0].key:'dashboard';
  destroyCharts();renderAll();
}

  return html;
}

function initOperationsCharts(){
  const isDark=currentTheme==='dark';
  const textColor=isDark?'#e6edf3':'#0f172a';
  const axisColor=isDark?'#8b949e':'#6B7A8D';
  const splitColor=isDark?'#21262d':'#f1f5f9';

  const dom=document.getElementById('chartFaultTimeline');
  if(!dom)return;
  const c=echarts.init(dom);
  charts.faultTimeline=c;
  const days=currentLang==='zh'?['7/24','7/25','7/26','7/27','7/28','7/29','7/30']:['Jul 24','Jul 25','Jul 26','Jul 27','Jul 28','Jul 29','Jul 30'];
  c.setOption({
    tooltip:{trigger:'axis',backgroundColor:isDark?'rgba(15,23,42,.92)':'rgba(255,255,255,.95)',borderColor:isDark?'#30363d':'#E2E8F2',textStyle:{color:textColor,fontSize:12}},
    legend:{data:[t('dashCritical'),t('dashMajor'),t('dashMinor'),'Warning'],bottom:0,itemWidth:10,itemHeight:10,textStyle:{color:axisColor,fontSize:11}},
    grid:{left:'3%',right:'4%',bottom:'14%',top:'5%',containLabel:true},
    xAxis:{type:'category',boundaryGap:false,data:days,axisLabel:{color:axisColor,fontSize:10},axisLine:{lineStyle:{color:axisColor}}},
    yAxis:{type:'value',minInterval:1,axisLabel:{color:axisColor,fontSize:10},splitLine:{lineStyle:{color:splitColor,type:'dashed'}}},
    series:[
      {name:t('dashCritical'),type:'line',stack:'Total',smooth:true,symbol:'circle',symbolSize:4,showSymbol:false,itemStyle:{color:'#d63031'},lineStyle:{width:2.5},areaStyle:{color:{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:'rgba(214,48,49,.35)'},{offset:1,color:'rgba(214,48,49,.02)'}]}},data:[0,1,0,0,1,0,1]},
      {name:t('dashMajor'),type:'line',stack:'Total',smooth:true,symbol:'circle',symbolSize:4,showSymbol:false,itemStyle:{color:'#e17055'},lineStyle:{width:2.5},areaStyle:{color:{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:'rgba(225,112,85,.3)'},{offset:1,color:'rgba(225,112,85,.02)'}]}},data:[1,0,2,1,0,1,2]},
      {name:t('dashMinor'),type:'line',stack:'Total',smooth:true,symbol:'circle',symbolSize:4,showSymbol:false,itemStyle:{color:'#0984e3'},lineStyle:{width:2.5},areaStyle:{color:{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:'rgba(9,132,227,.25)'},{offset:1,color:'rgba(9,132,227,.02)'}]}},data:[2,1,2,0,1,1,0]},
      {name:'Warning',type:'line',stack:'Total',smooth:true,symbol:'circle',symbolSize:4,showSymbol:false,itemStyle:{color:'#636e72'},lineStyle:{width:2},areaStyle:{color:{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:'rgba(99,110,114,.15)'},{offset:1,color:'rgba(99,110,114,.02)'}]}},data:[0,0,0,1,1,0,0]},
    ]
  });

  // Fault time pills
  const pills=document.getElementById('faultPills');
  if(pills){
    ['7D','30D','3M','1Y'].forEach((v,i)=>{
      const btn=document.createElement('button');
      btn.className='pill-tab'+(i===1?' active':'');
      btn.textContent=v;
      btn.onclick=function(){
        pills.querySelectorAll('.pill-tab').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
      };
      pills.appendChild(btn);
    });
  }
}

// ==================== Render All ====================
function getPageTitle(key){
  // Look up the translated menu item name for a given sidebar key
  var miKey='mi'+key.charAt(0).toUpperCase()+key.slice(1);
  // Handle special keys
  var map={monitor3d:'mi3D',ai:'miAI',planned:'miPlanned',toollogs:'miToolLogs',spareparts:'miSpareParts',scrap:'miScrap',roles:'miRoles'};
  if(map[key])miKey=map[key];
  // Convert camelCase to proper lookup: e.g. 'monitor3d' -> 'mi3D'
  return t(miKey)||key;
}
function renderAll(){
  renderTopNav();renderSidebar();
  var main=document.getElementById('mainContent');
  var html='';
  switch(currentPage){
    case'dashboard':html=renderDashboard();break;
    case'operations':html=renderOperations();break;
    case'devices':html=renderDevices();break;
    case'backups':html=renderBackups();break;
    case'faults':html=renderFaults();break;
    default:
      var title=getPageTitle(currentPage);
      html='<div class="simple-shell"><div class="page-header"><h2>'+title+'</h2></div><div class="card-panel" style="text-align:center;padding:60px;color:var(--text-muted);"><div style="font-size:48px;margin-bottom:16px;">🚧</div><p>'+(currentLang==='zh'?'演示页面 — 完整功能请运行后端系统':'Demo page — run the full system for complete features')+'</p></div></div>';
  }
  destroyCharts();
  main.innerHTML=html;
  applyI18n();
  if(currentPage==='operations')setTimeout(initOperationsCharts,150);
  if(currentPage==='dashboard')setTimeout(initDashboardCharts,150);
  updateClock();
}

function updateClock(){
  const now=new Date();
  const ts=now.toTimeString().slice(0,8);
  const el=document.getElementById('dashClock');
  if(el)el.textContent=ts;
}

window.addEventListener('resize',()=>{Object.values(charts).forEach(c=>{try{c.resize()}catch(e){}})});
