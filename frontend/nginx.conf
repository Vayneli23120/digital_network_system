# Network Automation System — 前端 nginx（HTTPS）
# 静态托管 Vue 构建产物，并把后端专属路径反向代理到 backend:8000。
#
# 使用 Docker 内嵌 DNS（127.0.0.11）+ 变量做运行时解析，避免后端容器重建
# （IP 变化）后 nginx 缓存旧地址导致 502。
#
# 生产：443 走 TLS（自签名证书挂载在 /etc/nginx/certs/），80 跳转 HTTPS。

# HTTP → HTTPS 跳转（仅当外部映射了 80 端口时生效）
server {
    listen 80;
    server_name _;
    return 301 https://$http_host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    # Docker 内嵌 DNS，每 30s 刷新一次
    resolver 127.0.0.11 valid=30s ipv6=off;

    # 后端专属路径 → 后端（API / WebSocket / 照片 / 扫码 / 静态资源 / 健康检查 / 文档）
    location ~ ^/(api|ws|photos|scanner|static|health|ready|docs|redoc|openapi) {
        set $backend_host backend:8000;
        proxy_pass http://$backend_host;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket（/ws/device-status、/ws/deploy/:sessionId）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # 静态资源（Vite 构建产物在 /assets/*）缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|map)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # SPA：其余路径回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
